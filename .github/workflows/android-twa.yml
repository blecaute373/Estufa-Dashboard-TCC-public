name: Android APK — TWA (Bubblewrap)

# Empacota o dashboard PWA (`/login-dashboard.html`) num APK/AAB Android nativo
# via Trusted Web Activity. O APK sai ASSINADO e e publicado numa Release — o
# mesmo ficheiro que a pagina inicial serve por QR code (`public/js/qr-app.js`).
#
# Como correr:
#   * Actions -> "Android APK — TWA (Bubblewrap)" -> Run workflow
#   * ou `git tag v1.0.0 && git push mine v1.0.0` (publica a Release)
#
# Detalhes do Bubblewrap que obrigam a este passo-a-passo (lidos no codigo-fonte
# do GoogleChromeLabs/bubblewrap; nao ha aqui margem para "tentar e ver"):
#   1. `Cli.run()` chama `loadOrCreateConfig()` ANTES de despachar o comando.
#      Se `~/.bubblewrap/config.json` nao existir, ele pergunta interactivamente
#      onde esta o JDK/SDK — e o job fica pendurado. Dai o passo "Configurar
#      Bubblewrap".
#   2. `AndroidSdkTools.validatePath()` exige que `androidSdkPath` tenha `bin/`
#      (ou `tools/`) na raiz, E `getAndroidHome()` devolve esse MESMO caminho
#      para achar `build-tools/`. Dai o symlink `bin`.
#   3. `build()` pergunta "actualizar o projecto?" quando falta
#      `manifest-checksum.txt`. Dai correr `update` ANTES de `build`.
#   4. As senhas vem de `BUBBLEWRAP_KEYSTORE_PASSWORD` / `BUBBLEWRAP_KEY_PASSWORD`.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'appVersion do APK (ex.: 1.2.0). Vazio = valor de twa/twa-manifest.json'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Gerar APK/AAB assinado
    runs-on: ubuntu-latest

    env:
      TWA_DIR: ${{ github.workspace }}/twa
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Senha do keystore. Defina o secret ANDROID_KEYSTORE_PASSWORD para usar uma
      # propria; sem ele, cai no valor de desenvolvimento abaixo (serve para
      # instalar no telemovel, nao para publicar na Play Store).
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'estufa01tcc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Clone completo: o passo "Commit do assetlinks.json" faz
          # `git push origin HEAD:main`, que falha em clone raso ("shallow
          # update not allowed"). `persist-credentials` mantém o GITHUB_TOKEN
          # para esse push (com `permissions.contents: write`).
          fetch-depth: 0
          persist-credentials: true

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          # Versao longa (build number) das cmdline-tools — ver tabela em
          # https://developer.android.com/studio#command-line-tools-only
          # (12.0 = 11076708; a accao instala-as e poe `sdkmanager` no PATH).
          # NUNCA pedir o pacote `tools` aqui: a Google descontinuou-o e o
          # `sdkmanager --install tools` falha com
          # "Warning: Failed to find package 'tools'".
          cmdline-tools-version: '11076708'
          # Pacotes validos do sdkmanager. `platform-tools` (adb) vem incluido
          # por omissao na accao, mas declara-se de forma explicita; o resto e
          # o que o Gradle/Bubblewrap precisam para compilar o TWA.
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Ajustar layout do SDK para o Bubblewrap
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          # O Bubblewrap procura `bin/sdkmanager` na raiz do SDK, mas o
          # cmdline-tools moderno guarda-o em `cmdline-tools/latest/bin`.
          CMDLINE_BIN="$SDK/cmdline-tools/latest/bin"
          if [ ! -d "$CMDLINE_BIN" ]; then
            CMDLINE_BIN="$(dirname "$(find "$SDK" -maxdepth 4 -type f -name sdkmanager | head -n1)")"
          fi
          echo "sdkmanager em: $CMDLINE_BIN"
          sudo ln -sfn "$CMDLINE_BIN" "$SDK/bin"
          ls -d "$SDK/bin" "$SDK/build-tools" "$SDK/platforms" 2>/dev/null || true
          # Aceitar licencas e instalar o que o Gradle/Bubblewrap precisam.
          # (Mantem-se alinhado com o `packages:` da accao acima: build-tools
          # 34.0.0 + android-34. O Bubblewrap/Gradle podem pedir API mais nova
          # depois — este passo apenas garante que o minimo ja existe.)
          ( yes | "$SDK/bin/sdkmanager" --sdk_root="$SDK" --licenses ) >/dev/null 2>&1 || true
          for pkg in "platform-tools" "build-tools;34.0.0" "platforms;android-34"; do
            "$SDK/bin/sdkmanager" --sdk_root="$SDK" --install "$pkg" >/dev/null 2>&1 \
              && echo "ok: $pkg" || echo "aviso: $pkg indisponivel (o Bubblewrap trata disso)"
          done
          echo "BUBBLEWRAP_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Configurar Bubblewrap (elimina todos os prompts)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BUBBLEWRAP_SDK" \
            > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Aplicar versao (tag/input -> twa-manifest.json)
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          VER="${{ inputs.app_version }}"
          case "${GITHUB_REF}" in refs/tags/v*) [ -n "$VER" ] || VER="${GITHUB_REF#refs/tags/v}";; esac
          if [ -n "$VER" ]; then
            jq --arg v "$VER" '.appVersion=$v' twa-manifest.json > m.tmp && mv m.tmp twa-manifest.json
          fi
          # appVersionCode tem de ser monotonico: usa-se o numero da execucao.
          jq --argjson c "${{ github.run_number }}" '.appVersionCode=$c' twa-manifest.json > m.tmp \
            && mv m.tmp twa-manifest.json
          jq -r '.packageId + " v" + .appVersion + " (" + (.appVersionCode|tostring) + ") em " + .host' \
            twa-manifest.json

      - name: Keystore de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
            echo "Keystore restaurado de ANDROID_KEYSTORE_BASE64."
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias estufa01 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -dname "CN=Estufa 01, OU=TCC, O=Estufa 01, C=BR"
            echo "KEYSTORE_GENERATED=1" >> "$GITHUB_ENV"
            echo "Keystore NOVO gerado. Guarde o artefacto 'keystore-assinatura' como"
            echo "secret ANDROID_KEYSTORE_BASE64 (base64 do ficheiro) para reutilizar."
          fi

      - name: Bubblewrap update (projecto Android + manifest-checksum.txt)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          npx --yes @bubblewrap/cli@latest update \
            --manifest "$TWA_DIR/twa-manifest.json" \
            --directory "$TWA_DIR" \
            --skipVersionUpgrade

      - name: Bubblewrap build (APK + AAB assinados)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          npx --yes @bubblewrap/cli@latest build \
            --manifest "$TWA_DIR/twa-manifest.json" \
            --directory "$TWA_DIR"

      - name: Digital Asset Links (remove a barra de URL do TWA)
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          # O Chrome so abre o TWA em ecra cheio (sem barra de endereco) se o
          # site publicar, em /.well-known/assetlinks.json, a impressao digital
          # SHA-256 da chave que assinou o APK. Extrai-se do proprio keystore,
          # para o APK e o assetlinks.json NUNCA se desencontrarem.
          FP="$(keytool -list -v -keystore android.keystore -alias estufa01 \
                  -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                  | grep -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' | head -n1 || true)"
          if [ -z "$FP" ]; then
            echo "::error::Nao foi possivel extrair a impressao digital SHA-256 do keystore."
            exit 1
          fi
          echo "SHA-256 do APK: $FP"
          mkdir -p "$GITHUB_WORKSPACE/public/.well-known"
          cat > "$GITHUB_WORKSPACE/public/.well-known/assetlinks.json" <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.estufa.dashboard",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          JSON
          cat "$GITHUB_WORKSPACE/public/.well-known/assetlinks.json"
          {
            echo "### Digital Asset Links"
            echo 'Coloque isto em `public/.well-known/assetlinks.json` e faca deploy.'
            echo '```json'
            cat "$GITHUB_WORKSPACE/public/.well-known/assetlinks.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recolher artefactos
        run: |
          set -euo pipefail
          cd "$TWA_DIR"
          # Nome fixo: e o que `public/js/qr-app.js` serve por QR code.
          cp app-release-signed.apk estufa01.apk
          ls -lh estufa01.apk app-release-bundle.aab

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: estufa01-android
          path: |
            twa/estufa01.apk
            twa/app-release-bundle.aab
            twa/twa-manifest.json
            public/.well-known/assetlinks.json
          if-no-files-found: error

      - name: Upload keystore (apenas se foi gerado agora)
        if: env.KEYSTORE_GENERATED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-assinatura
          path: twa/android.keystore
          if-no-files-found: error
          retention-days: 90

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            twa/estufa01.apk
            twa/app-release-bundle.aab

      # Fecha o ciclo sem intervenção humana: o fingerprint que o Chrome vai
      # comparar tem de estar publicado no site. Se este passo falhar (branch
      # protegida, por exemplo) o APK já está seguro nos artefactos — o
      # assetlinks.json fica disponível no artefacto para commit manual.
      - name: Commit do assetlinks.json
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin main --quiet || true
          git pull --rebase origin main || true
          if git diff --quiet -- public/.well-known/assetlinks.json; then
            echo "assetlinks.json ja esta actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          # `[skip ci]`: o ci.yml dispara em push para main e nao precisa de
          # correr outra vez por causa de um ficheiro estatico.
          git commit -m "chore(android): actualizar fingerprint SHA-256 do APK [skip ci]"
          git push origin HEAD:main
          echo "::notice::assetlinks.json actualizado e enviado para main."
