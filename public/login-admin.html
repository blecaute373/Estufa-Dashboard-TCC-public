<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest-admin.json">
<title>Estufa 01 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #08120a; --bg2:     #0d1f10; --bg3:     #112415;
  --glass:   rgba(15, 35, 18, 0.85);
  --border:  rgba(74, 222, 128, 0.12); --border2: rgba(74, 222, 128, 0.3);
  --green:   #4ade80; --green2:  #22c55e; --green3:  #16a34a;
  --lime:    #a3e635; --amber:   #fbbf24; --red:     #f87171;
  --text:    #e8f5e9; --text2:   #86efac; --muted:   #4d7355; --muted2:  #2d4a32;
  --mono:    'DM Mono', monospace; --serif:   'Lora', serif; --sans:    'Nunito', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 15% 10%, rgba(251,191,36,0.08) 0%, transparent 60%),
              radial-gradient(ellipse 60% 80% at 85% 90%, rgba(248,113,113,0.05) 0%, transparent 60%);
  pointer-events: none;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(rgba(74,222,128,0.018) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(74,222,128,0.018) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
.card {
  position: relative; z-index: 10; width: 100%; max-width: 420px; margin: 20px;
  background: var(--glass); backdrop-filter: blur(24px);
  border: 1px solid rgba(251,191,36,0.2); border-radius: 24px; overflow: hidden;
  animation: card-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to   { opacity: 1; transform: none; }
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber), var(--red), var(--amber), transparent);
}
.card-inner { padding: 36px 32px 32px; }
.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
.brand-icon {
  width: 52px; height: 52px; background: linear-gradient(135deg, #92400e, var(--amber));
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 0 32px rgba(251,191,36,0.3); flex-shrink: 0;
}
.brand-text h1 { font-family: var(--serif); font-size: 1.45rem; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.brand-text p { font-size: 0.7rem; color: var(--amber); font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }
.form-group { margin-bottom: 18px; }
label {
  display: block; font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 7px;
}
input {
  width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--text);
  font-family: var(--mono); font-size: 0.9rem; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input::placeholder { color: var(--muted2); }
input:focus { border-color: rgba(251,191,36,0.4); box-shadow: 0 0 0 3px rgba(251,191,36,0.06); }
.btn {
  width: 100%; padding: 13px; background: linear-gradient(135deg, #92400e, var(--amber));
  border: none; border-radius: 12px; color: #fff; font-family: var(--sans);
  font-size: 0.9rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(251,191,36,0.25); position: relative; overflow: hidden;
}
.btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(251,191,36,0.35); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-spinner {
  width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn.loading .btn-spinner { display: block; }
.btn.loading .btn-text { display: none; }
.msg {
  margin-top: 14px; padding: 10px 14px; border-radius: 10px;
  font-size: 0.8rem; display: none; animation: slide-in 0.3s ease;
}
.msg.show { display: block; }
.msg.error   { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: #fca5a5; }
.msg.success { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.25); color: var(--green); }
.admin-badge {
  text-align: center; margin-bottom: 20px; padding: 10px;
  background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2);
  border-radius: 10px; font-size: 0.75rem; color: var(--amber);
}
.card-footer {
  background: rgba(0,0,0,0.2); border-top: 1px solid var(--border);
  padding: 14px 32px; text-align: center;
}
.footer-info { font-size: 0.67rem; font-family: var(--mono); color: var(--muted); }
@media (max-width: 480px) { .card-inner { padding: 28px 20px 24px; } .card-footer { padding: 12px 20px; } }
</style>
</head>
<body>
<div class="card">
  <div class="card-inner">
    <div class="brand">
      <div class="brand-icon">🔐</div>
      <div class="brand-text">
        <h1>Acesso Admin</h1>
        <p>Estufa 01 · Painel de Controle</p>
      </div>
    </div>
    <div class="admin-badge">🔒 Acesso restrito a administradores</div>
    <div id="loginForm">
      <div class="form-group">
        <label>Usuário ou E-mail</label>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btnLogin" onclick="doLogin()">
        <div class="btn-inner">
          <div class="btn-spinner"></div>
          <span class="btn-text">Entrar como Admin</span>
        </div>
      </button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
  <div class="card-footer">
    <div class="footer-info">Estufa 01 · ThingSpeak</div>
  </div>
</div>
<script>
async function doLogin() {
  const btn = document.getElementById('btnLogin'); const msg = document.getElementById('loginMsg');
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) return showMsg(msg, 'error', 'Preencha todos os campos.');
  setLoading(btn, true); clearMsgs();
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:user,password:pass}) });
    const d = await r.json();
    if (r.ok) {
      if (!d.is_admin) { showMsg(msg,'error','Acesso negado. Esta conta não é administradora.'); return; }
      if (d.token) localStorage.setItem('estufa_token', d.token);
      showMsg(msg,'success',`✓ Bem-vindo, ${d.username}!`);
      setTimeout(()=>window.location.href='/admin.html',900);
    } else { showMsg(msg,'error',d.error||'Erro ao entrar.'); }
  } catch { showMsg(msg,'error','Sem conexão com o servidor.'); }
  finally { setLoading(btn,false); }
}
function setLoading(btn,on){btn.disabled=on;btn.classList.toggle('loading',on);}
function showMsg(el,type,text){el.className=`msg ${type} show`;el.textContent=text;}
function clearMsgs(){document.querySelectorAll('.msg').forEach(el=>el.classList.remove('show'));}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script src="pwa.js"></script>
</body>
</html>
