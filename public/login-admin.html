<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1810">
<meta name="description" content="Estufa 01 — entrada restrita da consola administrativa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest-admin.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230d1f10'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='%23fbbf24'%3E🔐%3C/text%3E%3C/svg%3E">
<title>Estufa 01 · Acesso Admin</title>
<script>(function(){try{var t=localStorage.getItem('estufa_theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/base2.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/auth2.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="particles" id="particles" aria-hidden="true"></div>

<main class="auth-card-page">
  <div class="auth-card admin">

    <div class="auth-card-head">
      <div class="auth-card-mark" aria-hidden="true">🔐</div>
      <div>
        <div class="auth-card-title">Acesso Admin</div>
        <div class="auth-card-sub">Estufa 01 · Painel de Controle</div>
      </div>
      <button class="btn-ghost icon-only theme-btn" type="button" data-theme-btn onclick="EstufaTheme.toggle()" aria-pressed="false" title="Alternar tema" style="margin-left:auto">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>

    <div class="auth-card-body">
      <div class="auth-notice show">🔒 Acesso restrito a administradores</div>

      <div id="loginForm">
        <div class="field">
          <label for="loginUser">Usuário ou E-mail</label>
          <div class="input-wrap plain">
            <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="loginPass">Senha</label>
          <div class="input-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
            <button class="peek" type="button" aria-label="Mostrar senha" onclick="peekPass('loginPass', this)">👁</button>
          </div>
        </div>
        <button class="btn-primary" id="btnLogin" type="button" onclick="doLogin()">
          <span class="btn-spinner" aria-hidden="true"></span><span class="btn-text">Entrar como Admin</span>
        </button>
        <div class="msg" id="loginMsg" role="alert"></div>
      </div>
    </div>

    <div class="auth-card-foot">
      <a href="/login-dashboard.html">← Acesso do usuário</a>
      <span>Estufa 01 · ThingSpeak</span>
    </div>

  </div>
</main>
<script>
/* ── PARTICLES ─ */
(function () {
  const box = document.getElementById('particles');
  if (!box) return;
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-10px';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.animationDuration = (10 + Math.random() * 12) + 's';
    box.appendChild(p);
  }
})();

function peekPass(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

async function doLogin() {
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('loginMsg');
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) return showMsg(msg, 'error', 'Preencha todos os campos.');
  setLoading(btn, true);
  clearMsgs();
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
    });
    const d = await r.json();
    if (r.ok) {
      if (!d.is_admin) { showMsg(msg, 'error', 'Acesso negado. Esta conta não é administradora.'); return; }
      if (d.token) localStorage.setItem('estufa_token', d.token);
      showMsg(msg, 'success', '✓ Bem-vindo, ' + d.username + '!');
      setTimeout(() => window.location.href = '/admin.html', 900);
    } else {
      showMsg(msg, 'error', d.detail || d.title || d.error || 'Erro ao entrar.');
    }
  } catch {
    showMsg(msg, 'error', 'Sem conexão com o servidor.');
  } finally {
    setLoading(btn, false);
  }
}

function setLoading(btn, on) { btn.disabled = on; btn.classList.toggle('loading', on); }
function showMsg(el, type, text) { el.className = 'msg ' + type + ' show'; el.textContent = text; }
function clearMsgs() { document.querySelectorAll('.msg').forEach(el => el.classList.remove('show')); }

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
<script src="/js/theme.js"></script>
<script src="/pwa.js"></script>
</body>
</html>
