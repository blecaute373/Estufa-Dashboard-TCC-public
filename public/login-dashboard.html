<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1810">
<meta name="description" content="Estufa 01 — entrada na consola de monitorização agrícola.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest-dashboard.json">
<title>Estufa 01 · Acesso</title>
<script>(function(){try{var t=localStorage.getItem('estufa_theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/base2.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/auth2.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="particles" id="particles" aria-hidden="true"></div>

<main class="auth-card-page">
  <div class="auth-card">

    <div class="auth-card-head">
      <div class="auth-card-mark" aria-hidden="true">🌿</div>
      <div>
        <div class="auth-card-title">Estufa 01</div>
        <div class="auth-card-sub">Monitor Agrícola · Dashboard</div>
      </div>
      <button class="btn-ghost icon-only theme-btn" type="button" data-theme-btn onclick="EstufaTheme.toggle()" aria-pressed="false" title="Alternar tema" style="margin-left:auto">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>

    <div class="auth-card-body">
      <div class="auth-notice" id="firstUserNotice">
        🌱 Nenhum usuário cadastrado. Você será o primeiro.
      </div>

      <div class="tabs" id="tabsEl">
        <button class="active" id="tabLogin" type="button" onclick="switchTab('login')">Entrar</button>
        <button id="tabRegister" type="button" onclick="switchTab('register')">Registrar</button>
      </div>

      <div class="welcome" id="welcomeBadge">
        <div class="w-icon" aria-hidden="true">🎉</div>
        <div id="welcomeText">Conta criada! Redirecionando…</div>
      </div>
      <!-- LOGIN -->
      <div id="loginForm">
        <div class="field">
          <label for="loginUser">Usuário ou E-mail</label>
          <div class="input-wrap plain">
            <input type="text" id="loginUser" placeholder="seunome ou email@exemplo.com" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="loginPass">Senha</label>
          <div class="input-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
            <button class="peek" type="button" aria-label="Mostrar senha" onclick="peekPass('loginPass', this)">👁</button>
          </div>
        </div>
        <button class="btn-primary" id="btnLogin" type="button" onclick="doLogin()">
          <span class="btn-spinner" aria-hidden="true"></span><span class="btn-text">Entrar no Dashboard</span>
        </button>
        <div class="msg" id="loginMsg" role="alert"></div>
      </div>

      <!-- REGISTRAR -->
      <div id="registerForm" style="display:none">
        <div class="field">
          <label for="regUser">Nome de Usuário</label>
          <div class="input-wrap plain">
            <input type="text" id="regUser" placeholder="seunome" autocomplete="username">
          </div>
          <div class="input-hint">3–30 caracteres · letras, números e _</div>
        </div>
        <div class="field">
          <label for="regEmail">E-mail</label>
          <div class="input-wrap plain">
            <input type="email" id="regEmail" placeholder="email@exemplo.com" autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="regPass">Senha</label>
          <div class="input-wrap">
            <input type="password" id="regPass" placeholder="Mínimo 8 caracteres" autocomplete="new-password" oninput="updateStrength(this.value)">
            <button class="peek" type="button" aria-label="Mostrar senha" onclick="peekPass('regPass', this)">👁</button>
          </div>
          <div class="strength" id="strengthWrap">
            <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
          </div>
        </div>
        <div class="field">
          <label for="regPass2">Confirmar Senha</label>
          <div class="input-wrap">
            <input type="password" id="regPass2" placeholder="Repita a senha" autocomplete="new-password">
            <button class="peek" type="button" aria-label="Mostrar senha" onclick="peekPass('regPass2', this)">👁</button>
          </div>
        </div>
        <button class="btn-primary" id="btnRegister" type="button" onclick="doRegister()">
          <span class="btn-spinner" aria-hidden="true"></span><span class="btn-text">Criar Conta</span>
        </button>
        <div class="msg" id="registerMsg" role="alert"></div>
      </div>
    </div>

    <div class="auth-card-foot">
      <span>Estufa 01 · ThingSpeak</span>
      <span id="userCount">—</span>
      <a href="/login-admin.html">Área administrativa →</a>
    </div>

  </div>
</main>

<script src="/js/auth-comum.js"></script>
<script src="/js/login.js"></script>
<script src="/js/theme.js"></script>
<script src="/pwa.js"></script>
</body>
</html>
